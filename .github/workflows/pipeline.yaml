name: Build and deploy

on:
  push: 
    branches: [ dev ]

  workflow_dispatch:

permissions:  
  id-token: write
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: dotnet build
        run: dotnet build -c Release

      - name: dotnet test
        run: dotnet test -c Release --no-build

      - name: dotnet publish
        run: dotnet publish src/GitHubActionsDotNet.Api/GitHubActionsDotNet.Api.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with: 
          name: GitHubActionsDotNet.Api
          path: artifacts/

  deploy_dev:
    name: Deploy to dev
    needs: build
    uses: ./.github/workflows/steps/deploy.yaml
    with:
      env: dev
    secrets: inherit

  deploy_prod:
    name: Deploy to prod
    needs: deploy_dev
    uses: ./.github/workflows/steps/deploy.yaml
    with:
      env: prod
    secrets: inherit